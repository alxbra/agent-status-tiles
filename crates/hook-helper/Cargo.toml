[package]
name = "hook-helper"
version = "0.1.0"
edition = "2021"
description = "Bounded local event journal writer for Agent Status Tiles hooks"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "hook-helper"
path = "src/main.rs"
