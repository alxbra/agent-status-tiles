name: Hook helper

on:
  pull_request:
    paths:
      - 'crates/hook-helper/**'
      - 'docs/hook-helper.md'
      - '.github/workflows/hook-helper.yml'
  push:
    branches:
      - staging
      - main
    paths:
      - 'crates/hook-helper/**'
      - 'docs/hook-helper.md'
      - '.github/workflows/hook-helper.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-14
    defaults:
      run:
        working-directory: crates/hook-helper
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
